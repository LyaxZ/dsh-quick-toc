name: Verify tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pack tarball
        run: |
          ASSET=$(npm pack --silent)
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          # stable name so /releases/latest/download/dsh-quick-toc.tgz always works
          cp "$ASSET" dsh-quick-toc.tgz
          echo "STABLE=dsh-quick-toc.tgz" >> "$GITHUB_ENV"

      # The release body defaults to the CHINESE changelog section for this tag
      # (CHANGELOG.md), with the English section (CHANGELOG.en.md) folded into a
      # collapsible block — Chinese first, English one click away.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          extract() {
            awk -v pat="## [${VERSION}]" '
              index($0, pat) == 1 { found = 1; next }
              found && index($0, "## [") == 1 { exit }
              found { print }
            ' "$1"
          }
          extract CHANGELOG.md > NOTES.zh.md
          extract CHANGELOG.en.md > NOTES.en.md
          if [ -s NOTES.zh.md ]; then
            {
              printf '**dsh-quick-toc %s**\n' "$VERSION"
              cat NOTES.zh.md
              if [ -s NOTES.en.md ]; then
                printf '\n<details>\n<summary>English</summary>\n\n'
                cat NOTES.en.md
                printf '\n</details>\n'
              fi
            } > NOTES.full.md
            echo "HAS_NOTES=1" >> "$GITHUB_ENV"
          else
            : > NOTES.full.md
            echo "HAS_NOTES=" >> "$GITHUB_ENV"
          fi

      # The release itself is created from the maintainer's machine, by
      # release.mjs in the workspace root, so it is credited to the maintainer
      # and not to github-actions[bot]. This job only proves the tag builds and
      # keeps the exact tarball it produced for the after-publish comparison.
      - name: Keep the tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: |
            ${{ env.ASSET }}
            ${{ env.STABLE }}
          if-no-files-found: error
